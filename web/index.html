<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Task & Routine Planner built with Flutter and Material 3.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="A-Task">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icon3D.png"/>
  <title>A-Task • Personal Planner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 999999;
      transition: opacity 0.4s ease;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: splashFadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashFadeIn {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .app-icon-box {
      width: 104px;
      height: 104px;
      background: #FFFFFF;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 22px;
    }

    .app-icon-box img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    .app-brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin: 0;
      color: #0F172A;
    }

    .app-brand-title span {
      color: #2563EB;
    }

    .app-brand-tagline {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
      margin-top: 6px;
      letter-spacing: 0.2px;
    }

    .splash-spinner {
      margin-top: 32px;
      width: 24px;
      height: 24px;
      border: 2.5px solid #E2E8F0;
      border-top-color: #2563EB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-loading">
    <div class="splash-content">
      <div class="app-icon-box">
        <img src="icon3D.png" alt="A-Task Logo">
      </div>
      <h1 class="app-brand-title">A-<span>Task</span></h1>
      <p class="app-brand-tagline">Personal Planner &amp; Routines</p>
      <div class="splash-spinner"></div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash-loading');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          splash.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js?v=scenic_auto_v2" async></script>
</body>
</html>
